[workspace]
name = "reta-arch-mojo"
version = "0.1.0"
description = "Reproducible build and test entrypoints for the reta Mojo transpilation project"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.15"
pytest = ">=8"
uv = ">=0.5"
cmake = ">=3.25"
ninja = ">=1.11"
pkg-config = ">=0.29"
c-compiler = "*"
openssl = "*"
sqlite = "*"

[tasks]
doctor = "scripts/reta_doctor.sh"
script-cleanup-status = "scripts/print_buildsystem_cleanup_status.sh"
check-toolchain = "scripts/check_pixi_cmake_toolchain.sh"
build-defaults = "scripts/print_build_defaults.sh"
mojo-version = "bin/mojo-real --version"
setup-mojo-venv = "scripts/setup_mojo.sh"
build = "scripts/run_build_task.sh build"
build-heavy = "scripts/run_build_task.sh build-heavy"
build-all = "scripts/run_build_task.sh build-all"
build-core-shared = "scripts/run_build_task.sh build-core-shared"
build-prompt-shared = "scripts/run_build_task.sh build-prompt-shared"
build-shared = "scripts/run_build_task.sh build-shared"
build-tests = "scripts/run_build_task.sh build-tests"
run-tests = "scripts/run_build_task.sh run-tests"
run-tests-parallel = "scripts/run_build_task.sh run-tests-parallel"
test = "scripts/run_build_task.sh test"
test-parallel = "scripts/run_build_task.sh test-parallel"
test-all = "scripts/run_build_task.sh test-all"
release-check = "scripts/run_build_task.sh release-check"
release-plan = "scripts/run_build_task.sh release-plan"
plan-build = "scripts/run_build_task.sh --dry-run build"
plan-build-all = "scripts/run_build_task.sh --dry-run build-all"
plan-build-core-shared = "scripts/run_build_task.sh --dry-run build-core-shared"
plan-build-shared = "scripts/run_build_task.sh --dry-run build-shared"
plan-build-tests = "scripts/run_build_task.sh --dry-run build-tests"
plan-test = "scripts/run_build_task.sh --dry-run test"
plan-release-check = "scripts/run_build_task.sh release-plan"

install-layout = "scripts/print_install_layout.sh"
artifact-manifest = "scripts/print_artifact_manifest.sh"
check-artifact-manifest = "scripts/check_artifact_manifest_consistency.sh"
check-project-launcher-layout = "scripts/check_project_launcher_layout.sh"
check-manpages = "scripts/run_install_task.sh check-manpages"
install = "scripts/run_install_task.sh install"
uninstall = "scripts/run_install_task.sh uninstall"
check-install-layout = "scripts/run_install_task.sh check-install-layout"
plan-install = "scripts/run_install_task.sh --dry-run install"
plan-uninstall = "scripts/run_install_task.sh --dry-run uninstall"
plan-check-install-layout = "scripts/run_install_task.sh --dry-run check-install-layout"
plan-check-manpages = "scripts/run_install_task.sh --dry-run check-manpages"
cmake-configure = "scripts/configure_cmake_with_defaults.sh"
cmake-list-targets = "cmake --build build --target help"
cmake-doctor = "cmake --build build --target reta-doctor"
cmake-script-cleanup-status = "cmake --build build --target reta-script-cleanup-status"
cmake-build = "cmake --build build"
cmake-build-core-shared = "cmake --build build --target reta-core-shared"
cmake-build-shared = "cmake --build build --target reta-shared"
cmake-build-all = "cmake --build build --target reta-all"
cmake-build-tests = "cmake --build build --target reta-tests-build"
cmake-plan-build-core-shared = "cmake --build build --target reta-plan-core-shared"
cmake-plan-build-all = "cmake --build build --target reta-plan-all"
cmake-plan-test = "cmake --build build --target reta-plan-test"
cmake-test = "cmake --build build --target reta-tests"
cmake-ctest = "ctest --test-dir build --output-on-failure"
cmake-install = "cmake --install build"
cmake-uninstall = "cmake --build build --target reta-uninstall"
cmake-check-install-layout = "cmake --build build --target reta-check-install-layout"
cmake-check-manpages = "cmake --build build --target reta-check-manpages"
cmake-check-project-launcher-layout = "cmake --build build --target reta-check-project-launcher-layout"
cmake-plan-install = "cmake --build build --target reta-install-plan"
cmake-plan-uninstall = "cmake --build build --target reta-uninstall-plan"
cmake-plan-check-install-layout = "cmake --build build --target reta-check-install-layout-plan"
cmake-install-layout = "cmake --build build --target reta-install-layout"
