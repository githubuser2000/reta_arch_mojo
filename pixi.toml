[workspace]
name = "reta-arch-mojo"
version = "0.1.0"
description = "Reproducible build and test entrypoints for the reta Mojo transpilation project"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.15"
pytest = ">=8"
uv = ">=0.5"
cmake = ">=3.25"
ninja = ">=1.11"
pkg-config = ">=0.29"
c-compiler = "*"
openssl = "*"
sqlite = "*"

[tasks]
check-toolchain = "scripts/check_pixi_cmake_toolchain.sh"
build-defaults = "scripts/print_build_defaults.sh"
mojo-version = "bin/mojo-real --version"
setup-mojo-venv = "RETA_SKIP_BUILD=1 scripts/setup_mojo.sh"
build = "scripts/run_build_task.sh build"
build-heavy = "scripts/run_build_task.sh build-heavy"
build-all = "scripts/run_build_task.sh build-all"
build-core-shared = "scripts/run_build_task.sh build-core-shared"
build-prompt-shared = "scripts/run_build_task.sh build-prompt-shared"
build-shared = "scripts/run_build_task.sh build-shared"
build-tests = "scripts/run_build_task.sh build-tests"
run-tests = "scripts/run_build_task.sh run-tests"
run-tests-parallel = "scripts/run_build_task.sh run-tests-parallel"
test = "scripts/run_build_task.sh test"
test-parallel = "scripts/run_build_task.sh test-parallel"
test-all = "scripts/run_build_task.sh test-all"
release-check = "scripts/run_build_task.sh release-check"
release-plan = "scripts/run_build_task.sh release-plan"

install-layout = "scripts/print_install_layout.sh"
artifact-manifest = "scripts/print_artifact_manifest.sh"
check-artifact-manifest = "scripts/check_artifact_manifest_consistency.sh"
install = "PREFIX=/usr/local scripts/install.sh"
uninstall = "PREFIX=/usr/local scripts/uninstall.sh"
check-install-layout = "PREFIX=/usr/local scripts/check_install_layout.sh"
cmake-configure = "scripts/configure_cmake_with_defaults.sh"
cmake-list-targets = "cmake --build build --target help"
cmake-build = "cmake --build build"
cmake-build-core-shared = "cmake --build build --target reta-core-shared"
cmake-build-shared = "cmake --build build --target reta-shared"
cmake-build-all = "cmake --build build --target reta-all"
cmake-build-tests = "cmake --build build --target reta-tests-build"
cmake-test = "cmake --build build --target reta-tests"
cmake-ctest = "ctest --test-dir build --output-on-failure"
cmake-install = "cmake --build build --target reta-install"
cmake-uninstall = "cmake --build build --target reta-uninstall"
cmake-check-install-layout = "cmake --build build --target reta-check-install-layout"
cmake-install-layout = "cmake --build build --target reta-install-layout"
